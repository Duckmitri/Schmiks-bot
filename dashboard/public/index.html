<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Discord Bot Configuration</h1>
        <form id="configForm">
            <div class="form-group">
                <label for="prefix">Command Prefix</label>
                <input type="text" id="prefix" name="prefix" placeholder="e.g., !" required>
            </div>
            <fieldset>
                <legend>Command Roles</legend>
                <div class="form-group">
                    <label for="moderatorRoleIds">Moderator Role IDs</label>
                    <textarea id="moderatorRoleIds" name="moderatorRoleIds" rows="3" placeholder="One Discord role ID per line"></textarea>
                </div>
                <div class="form-group">
                    <label for="adminRoleIds">Administrator Role IDs</label>
                    <textarea id="adminRoleIds" name="adminRoleIds" rows="3" placeholder="One Discord role ID per line"></textarea>
                </div>
                <p class="field-help">Administrator roles can also use moderator commands.</p>
            </fieldset>
            <fieldset>
                <legend>Logging</legend>
                <div class="form-group">
                    <label for="loggingChannelId">Shared Log Channel ID</label>
                    <input type="text" id="loggingChannelId" name="loggingChannelId" inputmode="numeric" placeholder="Leave blank to disable delivery">
                </div>
                <div class="form-group">
                    <label for="retentionDays">Retention Days</label>
                    <input type="number" id="retentionDays" name="retentionDays" min="1" max="3650" step="1" required>
                </div>
                <div class="delivery-options">
                    <label><input type="checkbox" data-delivery-key="commandExecution"> Command execution</label>
                    <label><input type="checkbox" data-delivery-key="messageEdit"> Message edit</label>
                    <label><input type="checkbox" data-delivery-key="messageDelete"> Message delete</label>
                    <label><input type="checkbox" data-delivery-key="memberJoin"> Member join</label>
                    <label><input type="checkbox" data-delivery-key="memberLeave"> Member leave</label>
                    <label><input type="checkbox" data-delivery-key="voiceJoin"> Voice join</label>
                    <label><input type="checkbox" data-delivery-key="voiceLeave"> Voice leave</label>
                </div>
                <h2>Embed Colors</h2>
                <p class="field-help">Click a swatch to open your browser's color picker.</p>
                <div class="color-options">
                    <label>Command execution <span><input type="color" data-color-key="commandExecution" value="#5865F2"><output data-color-value="commandExecution">#5865F2</output></span></label>
                    <label>Message edit <span><input type="color" data-color-key="messageEdit" value="#FEE75C"><output data-color-value="messageEdit">#FEE75C</output></span></label>
                    <label>Message delete <span><input type="color" data-color-key="messageDelete" value="#ED4245"><output data-color-value="messageDelete">#ED4245</output></span></label>
                    <label>Member join <span><input type="color" data-color-key="memberJoin" value="#57F287"><output data-color-value="memberJoin">#57F287</output></span></label>
                    <label>Member leave <span><input type="color" data-color-key="memberLeave" value="#ED4245"><output data-color-value="memberLeave">#ED4245</output></span></label>
                    <label>Voice join <span><input type="color" data-color-key="voiceJoin" value="#57F287"><output data-color-value="voiceJoin">#57F287</output></span></label>
                    <label>Voice leave <span><input type="color" data-color-key="voiceLeave" value="#ED4245"><output data-color-value="voiceLeave">#ED4245</output></span></label>
                </div>
            </fieldset>
            <button type="submit">Save Configuration</button>
        </form>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
